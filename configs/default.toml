[runtime]
# Every model endpoint must be loopback. A remote URL below is a startup error, not a fallback.
local_only = true

[audio]
sample_rate = 16000
channels = 1
dtype = "float32"
ring_buffer_seconds = 30
chunk_samples = 512  # Silero VAD requires 512 samples (32ms) at 16kHz

[vad]
threshold = 0.5
speech_end_silence_ms = 192  # 6 chunks; endpointing target is under 200 ms
minimum_speech_ms = 250
maximum_segment_seconds = 30
pre_roll_ms = 96
# Utterances with less than short_utterance_ms of speech (a wake word, "Jarvis,")
# wait this long instead, so the pause before the command does not split them.
short_utterance_ms = 1000
short_utterance_silence_ms = 480

[asr]
model = "ibm-granite/granite-speech-5.0-470m-turboctc"

[event_bus]
subscriber_queue_size = 256

[attention]
enabled = true
reason_threshold = 0.10
assistant_names = ["jarvis"]
working_memory_size = 20

[reasoning]
enabled = true
model = "gemma4:e2b-it-qat"
ollama_url = "http://127.0.0.1:11434"  # local Ollama on this Mac
num_ctx = 4096  # tokens; KV cache grows with it
max_context_messages = 6
max_context_characters = 4000
max_output_tokens = 256
temperature = 0.2
timeout_seconds = 30.0  # read timeout; connect has its own below
connect_timeout_seconds = 2.0
keep_alive = "30m"
think = false
# Second Ollama target tried when the primary fails. Empty fallback_model disables it (the default:
# one model in memory on a 16 GB machine).
fallback_url = "http://127.0.0.1:11434"
fallback_model = ""
# While the primary is down, one request per cooldown pays the connect timeout.
fallback_cooldown_seconds = 300.0

[response]
enabled = true

[tts]
enabled = true
model = "hf://gradium/phonon-31m-en"
voice = "Easton"  # list voices: .venv/bin/ptts --list-voices
quant = "q8_0"  # what "q8" resolved to; see ptts.available_quants()
max_text_length = 2000

[playback]
enabled = true
volume = 1.0
max_queue_seconds = 2.0
tail_ms = 200

[barge_in]
# Off by default: without echo cancellation the mic hears JARVIS's own voice.
# Enable only with headphones. While off, the mic is suppressed during playback.
enabled = false
vad_threshold = 0.8
min_speech_ms = 256

[logging]
level = "INFO"

[memory]
enabled = true
database_path = "~/.jarvis/jarvis.db"
max_retrieved_memories = 5
max_recent_messages = 8
cross_session = true

[fusion]
enabled = true
window_seconds = 15.0
max_events = 10
max_characters = 3000

[perception]
enabled = true
max_visual_events = 5
max_visual_context_characters = 3000
max_visual_event_age_seconds = 120.0
on_demand_timeout_seconds = 3.0
pause_during_turn = true

[perception.camera]
# Off by default: with vision off the camera would only feed a mock analyzer. Vision needs both on.
enabled = false
device_index = 0
width = 640
height = 480
capture_fps = 2.0
analysis_fps = 0.2  # one frame every 5s
max_frame_age_seconds = 5.0
max_queue_size = 1
change_threshold = 0.05
dedup_window_seconds = 15.0

[perception.vision]
enabled = false  # off for voice-pipeline validation; when on, reuses the reasoning model (no second model)
provider = "ollama"
model = "gemma4:e2b-it-qat"
ollama_url = "http://127.0.0.1:11434"
timeout_seconds = 60.0
max_image_size = 512
temperature = 0.1
prompt = ""  # empty = use default prompt
