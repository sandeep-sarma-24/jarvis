[audio]
sample_rate = 16000
channels = 1
dtype = "float32"
ring_buffer_seconds = 30
chunk_samples = 512  # Silero VAD requires 512 samples (32ms) at 16kHz

[vad]
threshold = 0.5
speech_end_silence_ms = 300
minimum_speech_ms = 250
maximum_segment_seconds = 30

[asr]
model = "Qwen/Qwen3-ASR-0.6B"

[event_bus]
subscriber_queue_size = 256

[attention]
enabled = true
reason_threshold = 0.4
assistant_names = ["jarvis"]
working_memory_size = 20

[reasoning]
enabled = true
model = "gemma4:12b"
ollama_url = "http://localhost:11434"
max_context_messages = 8
max_context_characters = 6000
max_output_tokens = 256
temperature = 0.2
timeout_seconds = 30.0
max_concurrent_requests = 1

[response]
enabled = true

[tts]
enabled = true
model = "mlx-community/Kokoro-82M-bf16"
voice = "bf_emma"
speed = 1.0
sample_rate = 24000
max_text_length = 2000

[playback]
enabled = true
volume = 1.0

[logging]
level = "INFO"

[memory]
enabled = true
database_path = "~/.jarvis/jarvis.db"
max_retrieved_memories = 5
max_recent_messages = 8

[fusion]
enabled = true
window_seconds = 15.0
max_events = 20
max_characters = 3000

[perception]
enabled = false  # disabled by default — camera requires explicit opt-in
max_visual_events = 5
max_visual_context_characters = 500
max_visual_event_age_seconds = 60.0

[perception.camera]
enabled = false
device_index = 0
width = 640
height = 480
capture_fps = 10.0
analysis_fps = 1.0
max_frame_age_seconds = 2.0
max_queue_size = 2
change_threshold = 0.05
dedup_window_seconds = 30.0

[perception.vision]
enabled = false  # enable to use real local vision model instead of mock
provider = "ollama"
model = "gemma4:12b"
ollama_url = "http://localhost:11434"
timeout_seconds = 120.0
max_image_size = 1024
temperature = 0.1
prompt = ""  # empty = use default prompt
