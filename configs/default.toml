[audio]
sample_rate = 16000
channels = 1
dtype = "float32"
ring_buffer_seconds = 30
chunk_samples = 512  # Silero VAD requires 512 samples (32ms) at 16kHz

[vad]
threshold = 0.5
speech_end_silence_ms = 300
minimum_speech_ms = 250
maximum_segment_seconds = 30

[asr]
model = "ibm-granite/granite-speech-5.0-470m-turboctc"

[event_bus]
subscriber_queue_size = 256

[attention]
enabled = true
reason_threshold = 0.10
assistant_names = ["jarvis"]
working_memory_size = 20

[reasoning]
enabled = true
model = "gemma4:e2b-it-qat"
ollama_url = "http://100.97.67.75:11434"  # HP Omen GPU via Tailscale
max_context_messages = 8
max_context_characters = 6000
max_output_tokens = 512
temperature = 0.2
timeout_seconds = 120.0
max_concurrent_requests = 1

[response]
enabled = true

[tts]
enabled = true
model = "hf://gradium/phonon-31m-en"
voice = "Easton"  # list voices: .venv/bin/ptts --list-voices
quant = "q8"
max_text_length = 2000

[playback]
enabled = true
volume = 1.0

[logging]
level = "INFO"

[memory]
enabled = true
database_path = "~/.jarvis/jarvis.db"
max_retrieved_memories = 5
max_recent_messages = 8

[fusion]
enabled = true
window_seconds = 15.0
max_events = 10
max_characters = 3000

[perception]
enabled = true
max_visual_events = 5
max_visual_context_characters = 3000
max_visual_event_age_seconds = 120.0

[perception.camera]
enabled = true
device_index = 0
width = 640
height = 480
capture_fps = 2.0
analysis_fps = 0.2  # one frame every 5s — vision runs on HP, won't starve reasoning
max_frame_age_seconds = 5.0
max_queue_size = 1
change_threshold = 0.05
dedup_window_seconds = 15.0

[perception.vision]
enabled = true
provider = "ollama"
model = "gemma4:e2b-it-qat"  # 4.3GB total, fits GTX 1650 Ti 4GB VRAM; vision+text+audio
ollama_url = "http://100.97.67.75:11434"  # HP Omen GPU via Tailscale
timeout_seconds = 60.0
max_image_size = 512
temperature = 0.1
prompt = ""  # empty = use default prompt
