[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — persistent multimodal personal AI assistant"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "sounddevice>=0.5",
    "numpy>=1.26",
    "silero-vad>=5",
    "onnxruntime>=1.16.1",
    "mlx-qwen3-asr>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
jarvis = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring loaded models (deselect with '-m \"not integration\"')",
    "hardware: marks tests requiring real microphone hardware",
]
